# task_map.yaml — master template
# Группы задач → задачи → критерии + вопросы (шаблонные формулировки с {PLACEHOLDER})
#
# criteria_fit:
#   fit     — задача напрямую создаёт сигнал для критерия, наблюдаемость высокая
#   partial — касается, но сигнал слабее или косвенный
#
# questions[].type:
#   case      — вопрос по разбору кейса (используется case transcript)
#   judgment  — вопрос на суждение/позицию (используется case transcript)
#   depth     — уточняющий вопрос для углубления (используется тот же transcript)
#
# questions[].criterion — к какому критерию относится вопрос
# questions[].levels    — на какие уровни (-2/-1/0) рассчитан вопрос
#   all   — валиден для любого уровня
#   top   — только для проверки уровня 0 (follow-up если -1 уже показан)

task_groups:

  - id: TG-01
    name: Стратегия и позиционирование продукта
    tasks:

      - id: T-01
        name: Сформулировать стратегию и ценностное предложение {PRODUCT}
        criteria_fit:
          C03: fit      # Создание и управление стратегией продукта
          C11: fit      # Определение персон, потребностей и сценариев
          C01: partial  # Управление бизнес-моделью и монетизацией
        questions:
          - id: Q-T01-1
            criterion: C03
            type: judgment
            levels: all
            text: >
              Как бы ты сформулировал ценностное предложение {PRODUCT} для {TARGET_AUDIENCE_SEGMENTS}?
              Что именно мы обещаем и что теряем, делая этот выбор?

          - id: Q-T01-2
            criterion: C03
            type: depth
            levels: top
            text: >
              Если бы тебе нужно было выбрать один ключевой трейдофф в стратегии {PRODUCT} —
              что мы принципиально не делаем ради того, что делаем? Почему?

          - id: Q-T01-3
            criterion: C11
            type: case
            levels: all
            text: >
              Посмотри на данные по сегментам {TARGET_AUDIENCE_SEGMENTS}.
              Для кого именно создаётся {PRODUCT} сейчас, и есть ли разрыв между целевым сегментом
              и тем, для кого реально строится продукт?

  - id: TG-02
    name: Монетизация и юнит-экономика
    tasks:

      - id: T-02
        name: Управлять юнит-экономикой и структурой доходов {PRODUCT}
        criteria_fit:
          C01: fit      # Управление бизнес-моделью и монетизацией
          C05: fit      # Управление бюджетом
        questions:
          - id: Q-T02-1
            criterion: C01
            type: case
            levels: all
            text: >
              Глядя на метрики {FINANCIAL_METRICS_DOMAIN}, что происходит с экономикой {PRODUCT}?
              Какие цифры тебя беспокоят больше всего и почему?

          - id: Q-T02-2
            criterion: C01
            type: depth
            levels: top
            text: >
              Как бы ты улучшил монетизацию через {MONETIZATION_LEVERS}?
              Покажи прогноз эффекта хотя бы на одно изменение.

          - id: Q-T02-3
            criterion: C05
            type: case
            levels: all
            text: >
              Посмотри на структуру затрат: {COST_CATEGORIES}.
              Где, на твой взгляд, деньги тратятся неэффективно?
              Что бы ты предложил оптимизировать и как оценил бы эффект?

  - id: TG-03
    name: Метрики и аналитика
    tasks:

      - id: T-03
        name: Определить систему метрик и KPI для {PRODUCT}
        criteria_fit:
          C08: fit      # Определение пользовательских метрик, построение системы метрик
          C22: fit      # Работать с данными и метриками
        questions:
          - id: Q-T03-1
            criterion: C08
            type: case
            levels: all
            text: >
              Посмотри на {USER_BEHAVIOR_METRICS_DOMAIN}.
              Какая из этих метрик является для тебя ключевой и почему?
              Как она связана с бизнес-результатом?

          - id: Q-T03-2
            criterion: C08
            type: depth
            levels: top
            text: >
              Предложи систему метрик для {PRODUCT}: что измеряем на уровне активации,
              вовлечения, удержания? Покажи причинно-следственную связь с выручкой.

          - id: Q-T03-3
            criterion: C22
            type: case
            levels: all
            text: >
              Есть ли в этих данных метрики, которым ты бы не доверял?
              Где может быть смещение, сезонность или некорректное определение?
              Как бы ты починил измерение?

      - id: T-04
        name: Управлять исследованиями и переводить инсайты в решения
        criteria_fit:
          C10: fit      # Управление рыночными исследованиями
          C21: fit      # Находить точки роста и инсайты из исследований
          C11: partial  # Определение персон, потребностей и сценариев
        questions:
          - id: Q-T04-1
            criterion: C10
            type: case
            levels: all
            text: >
              Посмотри на результаты исследований по {PRODUCT}.
              Каким из них ты доверяешь и почему? Где видишь ошибки методологии
              или недостаток данных?

          - id: Q-T04-2
            criterion: C21
            type: case
            levels: all
            text: >
              Что из этих исследований даёт тебе конкретную точку роста?
              Какое решение ты бы принял прямо сейчас на основе этих данных?

          - id: Q-T04-3
            criterion: C11
            type: case
            levels: all
            text: >
              Посмотри на данные о пользователях из {TARGET_AUDIENCE_SEGMENTS}.
              Чьи потребности сейчас закрыты продуктом, а чьи — нет?
              Есть ли пробелы в понимании пользователей, которые мешают принять решение?

  - id: TG-04
    name: Планирование и поставка
    tasks:

      - id: T-05
        name: Спланировать работу команды на квартал и год
        criteria_fit:
          C07: fit      # Планирование в горизонте года для нескольких команд
          C16: fit      # Приоритизация и поставка в условиях дедлайнов
        questions:
          - id: Q-T05-1
            criterion: C07
            type: judgment
            levels: all
            text: >
              Если бы тебе нужно было сделать план на следующий квартал для {PRODUCT},
              какие 2–3 ставки ты бы сделал? На чём основываешь приоритеты?

          - id: Q-T05-2
            criterion: C07
            type: depth
            levels: top
            text: >
              Как бы ты обозначил развилки и точки принятия решений в этом плане?
              Какие риски и зависимости критичны?

          - id: Q-T05-3
            criterion: C16
            type: judgment
            levels: all
            text: >
              Если ресурсов не хватает на всё, что в плане, что ты режешь первым?
              Как принимаешь это решение вместе с командой?

      - id: T-06
        name: Управлять продуктовым процессом и гипотезами
        criteria_fit:
          C18: fit      # Управление продуктовым процессом
          C23: fit      # Формулировать гипотезы и бизнес-требования
        questions:
          - id: Q-T06-1
            criterion: C18
            type: case
            levels: all
            text: >
              Посмотри на продуктовые артефакты: OKR, A/B-тесты, результаты исследований.
              Что из этого сделано правильно, а где ты видишь ошибку в процессе?

          - id: Q-T06-2
            criterion: C18
            type: depth
            levels: top
            text: >
              Как бы ты изменил процесс принятия решений в этой команде?
              Что конкретно сломано и как починить?

          - id: Q-T06-3
            criterion: C23
            type: judgment
            levels: all
            text: >
              Выбери одну проблему, которую ты видишь в {PRODUCT}.
              Сформулируй гипотезу: что проверяем, как проверяем, что считаем успехом.
